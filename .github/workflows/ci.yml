name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Real browser tests against the real API (the payroll-kit repo), seeded with its demo data.
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      THROTTLE_TOKEN: 1000/min
      THROTTLE_ANON: 1000/min
      THROTTLE_USER: 5000/min
      E2E_BACKEND_DIR: backend
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oktoberlin/payroll-kit
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python manage.py migrate --noinput
        working-directory: backend
      - name: Start the API
        working-directory: backend
        run: |
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health/ && break || sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            api.log
